<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- homey-widget-full: no Homey padding; the widget has its own spacing (and auto height measures it) -->
<body class="homey-widget-full">
<main id="root">

  <!-- Shown when no device is configured, or when loading fails -->
  <div id="message" class="message" hidden>
    <svg class="message__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
    </svg>
    <p class="message__title" id="message-title"></p>
    <p class="message__text" id="message-text"></p>
  </div>

  <div id="flow" class="flow" hidden>

    <!-- Connectors: dots travel toward Home when data-in="forward" plays normally -->
    <div class="conn conn--v" data-conn="solar" data-in="forward" style="grid-area: c-solar">
      <span class="conn__line"></span>
      <span class="conn__dot"></span><span class="conn__dot"></span><span class="conn__dot"></span>
    </div>
    <div class="conn conn--h" data-conn="grid" data-in="forward" style="grid-area: c-grid">
      <span class="conn__line"></span>
      <span class="conn__dot"></span><span class="conn__dot"></span><span class="conn__dot"></span>
    </div>
    <div class="conn conn--h" data-conn="battery" data-in="reverse" style="grid-area: c-battery">
      <span class="conn__line"></span>
      <span class="conn__dot"></span><span class="conn__dot"></span><span class="conn__dot"></span>
    </div>
    <div class="conn conn--v" data-conn="ev" data-in="reverse" style="grid-area: c-ev">
      <span class="conn__line"></span>
      <span class="conn__dot"></span><span class="conn__dot"></span><span class="conn__dot"></span>
    </div>
    <!-- Diagonal Home → extra consumer: a horizontal connector, rotated and placed in JS -->
    <div class="conn conn--h conn--d" data-conn="extra" data-in="reverse">
      <span class="conn__line"></span>
      <span class="conn__dot"></span><span class="conn__dot"></span><span class="conn__dot"></span>
    </div>

    <!-- Nodes -->
    <div class="node node--solar" data-node="solar" style="grid-area: solar">
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

    <div class="node node--grid" data-node="grid" style="grid-area: grid">
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 22 12 2l4 20M9.2 16h5.6M10 12h4M6 6h12M7 9h10"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

    <div class="node node--home" data-node="home" style="grid-area: home">
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11 12 3l9 8M5 9.5V21h14V9.5M10 21v-6h4v6"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

    <div class="node node--battery" data-node="battery" style="grid-area: battery">
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="4" width="12" height="18" rx="2"/>
            <path d="M10 2h4M12 9l-2 4h4l-2 4"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

    <div class="node node--ev" data-node="ev" style="grid-area: ev">
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 17h14v-5l-2-5H7l-2 5v5zM5 12h14M7.5 17v2M16.5 17v2"/>
            <circle cx="8" cy="14.5" r="0.6"/>
            <circle cx="16" cy="14.5" r="0.6"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

    <div class="node node--extra" data-node="extra" style="grid-area: extra" hidden>
      <div class="node__ring">
        <div class="node__face">
          <svg class="node__icon" data-extra-icon="heatpump" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <circle cx="10" cy="12" r="4"/>
            <path d="M10 8v8M6 12h8M17 9v6"/>
          </svg>
          <svg class="node__icon" data-extra-icon="sauna" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M4 20h16M6 20v-4h12v4M9 4c-1 2 1 3 0 5M12 4c-1 2 1 3 0 5M15 4c-1 2 1 3 0 5"/>
          </svg>
          <svg class="node__icon" data-extra-icon="pool" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M3 17c2 0 2-1.5 4.5-1.5S10 17 12 17s2-1.5 4.5-1.5S19 17 21 17M3 21c2 0 2-1.5 4.5-1.5S10 21 12 21s2-1.5 4.5-1.5S19 21 21 21M8 14V6a2 2 0 0 1 4 0M16 14V6a2 2 0 0 0-4 0M8 10h8"/>
          </svg>
          <svg class="node__icon" data-extra-icon="other" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M9 3v5M15 3v5M7 8h10v4a5 5 0 0 1-10 0V8zM12 17v4"/>
          </svg>
          <span class="node__value" data-value>—</span>
        </div>
      </div>
      <span class="node__badge" data-badge hidden></span>
      <span class="node__label" data-label></span>
      <span class="node__status" data-status></span>
    </div>

  </div>

  <!-- Today's totals (kWh), self-sufficiency and solar self-consumption -->
  <div id="today" class="today" hidden>
    <span class="today__title" data-today-title></span>
    <span class="today__item today__item--solar" data-today="solar" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--grid" data-today="import" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--export" data-today="export" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--ev" data-today="ev" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--battery" data-today="battery" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--extra" data-today="extra" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--self" data-today="self" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
    <span class="today__item today__item--selfuse" data-today="selfUse" hidden>
      <span class="today__dot"></span><span data-label></span> <b data-value></b>
    </span>
  </div>

  <!-- Shown when the calculated home consumption stays negative (likely a sign setting) -->
  <p id="sign-hint" class="sign-hint" hidden></p>

  <!-- Shown while the widget uses automatically suggested devices (nothing configured yet) -->
  <p id="auto-note" class="auto-note" hidden></p>

  <!-- Only shown when the app runs via `homey app run` (backend returns debug: true) -->
  <div id="debug" class="debug" hidden></div>

</main>

    const SIGN_HINT_AFTER_MS = 3 * 60 * 1000;
    const RESUBSCRIBE_INTERVAL_MS = 60 * 1000;
    const STALE_CHECK_INTERVAL_MS = 30 * 1000;
    // Calls to the app can hang while it (or Homey) is starting: never wait on them forever.
    const API_TIMEOUT_MS = 10 * 1000;
    const SUGGEST_RETRY_MS = 15 * 1000;
    // While the app waits for other apps at startup, ask again this often.
    const STARTING_RETRY_MS = 5 * 1000;

      let timer;
      return Promise.race([
        promise,
        new Promise((resolve, reject) => {
          timer = setTimeout(() => reject(new Error(`Timed out after ${ms} ms`)), ms);

      ]).finally(() => clearTimeout(timer));

    function pickLanguage(Homey) {
      let lang = null;
      try {
        if (Homey.i18n && typeof Homey.i18n.getLanguage === 'function') lang = Homey.i18n.getLanguage();
      } catch (err) { /* fall through */ }
      lang = String(lang || navigator.language || 'en').slice(0, 2).toLowerCase();
      if (lang === 'nb' || lang === 'nn') lang = 'no'; // browser codes for Norwegian
      return STRINGS[lang] ? lang : 'en';
    }

    // eslint-disable-next-line no-unused-vars
    async function onHomeyReady(Homey) {
      // Only touch the page when something actually changed: the widget re-renders on every live
      // update, and unchanged writes still cost style and layout work (on wall tablets, all day).
      const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
      const setTitle = (el, title) => { if (el.title !== title) el.title = title; };
      const setHidden = (el, hidden) => { if (el.hidden !== hidden) el.hidden = hidden; };
      const toggleClass = (el, cls, on) => { if (el.classList.contains(cls) !== on) el.classList.toggle(cls, on); };
      const setStyle = (el, prop, value) => { if (el.style.getPropertyValue(prop) !== value) el.style.setProperty(prop, value); };

      const lang = pickLanguage(Homey);
      const t = STRINGS[lang];
      const fmt1 = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const fmt2 = new Intl.NumberFormat(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const fmt0 = new Intl.NumberFormat(lang, { maximumFractionDigits: 0 });

      function formatPower(watts) {
        if (watts === null || watts === undefined || Number.isNaN(watts)) return '—';
        const abs = Math.abs(watts);
        if (abs < 1000) return `${fmt0.format(abs)} W`;
        const kw = abs / 1000;
        return `${(kw < 10 ? fmt2 : fmt1).format(kw)} kW`;
      }

      function formatKwh(kwh, approximate) {
        const text = `${(kwh >= 100 ? fmt0 : fmt1).format(kwh)} kWh`;
        return approximate ? `≈ ${text}` : text;
      }

      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
      }

      const settings = (await Promise.resolve(Homey.getSettings())) || {};
      const invert = {
        grid: settings.grid_invert === true,
        battery: settings.battery_invert === true,
      };
      const staleMs = (toNumber(settings.stale_minutes) ?? 10) * 60 * 1000;
      const showToday = settings.show_today !== false;

      /* ---------------- State ---------------- */

      // A "source" is a device, or one specific capability of a device ("<deviceId>|<capabilityId>",
      // e.g. a solar sub-capability of a hybrid inverter). sourceId -> per-source state.
      const sources = new Map();
      // role -> [sourceId]
      const roleIds = {};
      // deviceId -> [sourceId], to route live updates that arrive per device + capability
      const deviceSources = new Map();

      function addSource(role, { id: sourceId, name }, previous) {
        roleIds[role].push(sourceId);
        if (sources.has(sourceId)) return;

        const deviceId = sourceId.split('|')[0];
        sources.set(sourceId, (previous && previous.get(sourceId)) || {
          id: sourceId,
          deviceId,
          name,
          missing: false,
          available: true,
          powerCap: null,
          socCap: null,
          hasPower: false,
          hasSoc: false,
          power: null,
          powerTs: null,
          soc: null,
          today: null,
        });
        if (!deviceSources.has(deviceId)) deviceSources.set(deviceId, []);
        deviceSources.get(deviceId).push(sourceId);
      }

      // Roles the user hasn't touched use the app's suggestions (see FlowLogic.pickSources).
      // The chosen devices are shown right away; suggestions are added when they arrive.
      let autoUsedRoles = [];
      let autoMode = false;
      let suggestionPending = FlowLogic.autoRoles(settings).length > 0;
      let hasLoaded = false;

      function applySelection(suggestion) {
        const { roles: picked, autoUsedRoles: used } = FlowLogic.pickSources(settings, suggestion);
        const previous = new Map(sources);
        sources.clear();
        deviceSources.clear();
        for (const role of ALL_ROLES) {
          roleIds[role] = [];
          for (const item of picked[role]) addSource(role, item, previous);
        }
        autoUsedRoles = used;
        autoMode = used.length > 0;
      }
      applySelection(null);

      // Homey's clock minus this device's clock, so staleness works even if the
      // dashboard runs on a phone with a slightly wrong clock.
      let clockOffset = 0;
      const homeyNow = () => Date.now() + clockOffset;

      /* ---------------- Elements ---------------- */

      const $ = (id) => document.getElementById(id);
      const els = {
        root: $('root'),
        flow: $('flow'),
        message: $('message'),
        messageTitle: $('message-title'),
        messageText: $('message-text'),
        today: $('today'),
        autoNote: $('auto-note'),
        signHint: $('sign-hint'),
        debug: $('debug'),
        nodes: {},
        conns: {},
        todayItems: {},
      };
      for (const node of document.querySelectorAll('[data-node]')) {
        const role = node.dataset.node;
        els.nodes[role] = {
          root: node,
          value: node.querySelector('[data-value]'),
          label: node.querySelector('[data-label]'),
          status: node.querySelector('[data-status]'),
          badge: node.querySelector('[data-badge]'),
        };
        els.nodes[role].label.textContent = t[role];
      }
      for (const conn of document.querySelectorAll('[data-conn]')) {
        els.conns[conn.dataset.conn] = conn;
      }
      // The extra node (optional big consumer): name and icon from its settings.
      const EXTRA_TYPES = ['heatpump', 'sauna', 'pool', 'other'];
      const extraType = EXTRA_TYPES.includes(settings.extra_type) ? settings.extra_type : 'heatpump';
      const extraLabel = (typeof settings.extra_name === 'string' && settings.extra_name.trim()) || t[`extra_${extraType}`];
      els.nodes.extra.label.textContent = extraLabel;
      for (const icon of els.nodes.extra.root.querySelectorAll('[data-extra-icon]')) {
        // An attribute, not the .hidden property: <svg> elements don't have that property.
        icon.toggleAttribute('hidden', icon.dataset.extraIcon !== extraType);
      }

      const todayLabels = {
        solar: t.todaySolar,
        import: t.todayImport,
        export: t.todayExport,
        ev: t.todayEv,
        battery: t.todayBattery,
        extra: extraLabel,
        self: t.selfSufficiency,
        selfUse: t.selfConsumption,
      };
      for (const item of document.querySelectorAll('[data-today]')) {
        const key = item.dataset.today;
        els.todayItems[key] = { root: item, value: item.querySelector('[data-value]') };
        item.querySelector('[data-label]').textContent = todayLabels[key];
      }
      els.today.querySelector('[data-today-title]').textContent = t.today;

      function showMessage(title, text) {
        setText(els.messageTitle, title);
        setText(els.messageText, text);
        setHidden(els.message, false);
        setHidden(els.flow, true);
        setHidden(els.today, true);
        setHidden(els.autoNote, true);
        setHidden(els.signHint, true);
      }

      function showFlow() {
        setHidden(els.message, true);
        setHidden(els.flow, false);
        setHidden(els.autoNote, !autoMode);
        if (autoMode) {
          setText(els.autoNote, t.autoNote);
          setTitle(els.autoNote, [...sources.values()].map((s) => s.name).filter(Boolean).join(' · '));
        }
      }

      /* ---------------- Calculations ---------------- */

      const listOf = (role) => roleIds[role].map((id) => sources.get(id));
      const roleInfo = (role, now) => FlowLogic.aggregateRole(role, listOf(role), { now, staleMs, invert });
      const roleToday = (role) => FlowLogic.aggregateToday(role, listOf(role), invert);
      const { towardHome } = FlowLogic;

      function statusFor(role, info, watts) {
        // Still loading: the first data, or the suggestion that may fill this role.
        if ((!hasLoaded && info.configured) || (suggestionPending && !info.configured)) return '…';
        const key = FlowLogic.statusKey(role, info, watts);
        return key === 'lastSeen' ? t.lastSeen.replace('{time}', formatTime(info.staleSince)) : t[key];
      }

      /* ---------------- Rendering ---------------- */

      const warnings = [];

      function renderNode(role, info, watts) {
        const node = els.nodes[role];
        if (role === 'extra') setHidden(node.root, !info.configured);

        toggleClass(node.root, 'is-unset', !info.configured);
        toggleClass(node.root, 'is-missing', info.allMissing);
        toggleClass(node.root, 'is-offline', info.allOffline);
        toggleClass(node.root, 'is-stale', info.staleSince !== null);
        toggleClass(node.root, 'is-active', watts !== null && Math.abs(watts) >= IDLE_THRESHOLD_W);

        setText(node.value, info.configured && info.hasPower ? formatPower(watts) : '—');
        setText(node.status, statusFor(role, info, watts));

        // State-of-charge ring and badge. The EV node uses the car's SoC when a car is selected.
        let soc = info.soc;
        const names = [...info.names];
        if (role === 'ev') {
          const car = roleInfo('car', homeyNow());
          if (car.soc !== null) soc = car.soc;
          names.push(...car.names);
        }
        if (soc !== null) soc = Math.max(0, Math.min(100, soc));

        toggleClass(node.root, 'has-soc', soc !== null);
        toggleClass(node.root, 'is-low', soc !== null && soc < LOW_SOC_PERCENT);
        if (soc !== null) {
          setStyle(node.root, '--soc', soc.toFixed(1));
          setText(node.badge, `${Math.round(soc)} %`);
          setHidden(node.badge, false);
          // Battery with SoC but no power capability: show SoC as the main value.
          if (!info.hasPower) setText(node.value, `${Math.round(soc)} %`);
        } else {
          setHidden(node.badge, true);
        }
        setTitle(node.root, names.join(' · '));
      }

      function renderConnector(role, info, watts) {
        const conn = els.conns[role];
        const direction = info.allOffline || info.allMissing ? null : towardHome(role, watts);

        toggleClass(conn, 'is-hidden', !info.configured);
        toggleClass(conn, 'is-active', direction !== null);
        if (direction === null) {
          conn.style.removeProperty('--flow-weight');
          return;
        }
        const forward = conn.dataset.in === 'forward';
        setStyle(conn, '--flow-direction', direction === forward ? 'normal' : 'reverse');
        setStyle(conn, '--flow-duration', `${flowDuration(watts).toFixed(2)}s`);
        setStyle(conn, '--flow-weight', `${flowWeight(watts).toFixed(1)}px`);
      }

      // Returns the home consumption in W (or null).
      function renderHome(powers, now) {
        const node = els.nodes.home;
        const meter = roleInfo('home', now);
        let home = null;
        let status = '';

        if (meter.configured) {
          // Measured by a dedicated meter
          home = meter.power;
          status = meter.allMissing ? t.missing
            : meter.allOffline ? t.offline
              : meter.staleSince !== null ? t.lastSeen.replace('{time}', formatTime(meter.staleSince))
                : t.consumption;
          toggleClass(node.root, 'is-missing', meter.allMissing);
          toggleClass(node.root, 'is-offline', meter.allOffline);
          toggleClass(node.root, 'is-stale', meter.staleSince !== null);
          setTitle(node.root, meter.names.join(' · '));
        } else if (powers.grid !== null) {
          // Calculated: what comes in (grid import + solar + battery discharge) minus what goes
          // to the battery and the EV charger.
          const raw = FlowLogic.calcHome(powers);
          if (raw < HOME_CALC_WARNING_W) {
            warnings.push(`Home calc is ${Math.round(raw)} W (<0): check the sign of grid/battery or invert settings`);
          }
          trackNegativeHome(raw, powers, now);
          home = Math.max(0, raw);
          status = t.estimated;
        } else {
          trackNegativeHome(null, powers, now);
        }

        // The extra consumer is fed from Home and drawn separately: Home shows the rest of the
        // house. Self-sufficiency (and the return value) use the whole consumption.
        const shown = roleIds.extra.length ? FlowLogic.homeRest(home, powers.extra) : home;
        setText(node.value, formatPower(shown));
        setText(node.status, status);
        toggleClass(node.root, 'is-active', shown !== null && shown >= IDLE_THRESHOLD_W);
        return home;
      }

      // A calculated home consumption that stays negative almost always means a sign is the
      // wrong way round. Meters report at different moments, so only react when it persists.
      let negativeSince = null;
      function trackNegativeHome(raw, powers, now) {
        if (raw === null || raw >= HOME_CALC_WARNING_W) {
          negativeSince = null;
          setHidden(els.signHint, true);
          return;
        }
        if (negativeSince === null) negativeSince = now;
        if (now - negativeSince < SIGN_HINT_AFTER_MS) return;

        const kind = FlowLogic.signHintKind(raw, powers);
        setText(els.signHint, kind === 'grid' ? t.signHintGrid
          : kind === 'battery' ? t.signHintBattery
            : t.signHint);
        setHidden(els.signHint, false);
      }

      function setTodayItem(key, text) {
        const item = els.todayItems[key];
        setHidden(item.root, text === null);
        if (text !== null) setText(item.value, text);
      }

      // "Charged from solar" totals from the app for this widget's roles, or null.
      let split = null;

      /** " · 68 % sol" for the EV or battery item, or '' when there is too little to tell. */
      function solarShare(totalKey, solarKey) {
        if (!split || !(split[totalKey] >= 0.05)) return '';
        const share = Math.max(0, Math.min(1, split[solarKey] / split[totalKey]));
        return ` · ${Math.round(share * 100)} % ${t.fromSolar}`;
      }

      function renderToday(powers, home) {
        if (!showToday) {
          setHidden(els.today, true);
          return;
        }

        const grid = roleToday('grid');
        const solar = roleToday('solar');
        const ev = roleToday('ev');
        const battery = roleToday('battery');

        setTodayItem('solar', solar ? formatKwh(solar.in + solar.out, solar.approximate) : null);
        setTodayItem('import', grid ? formatKwh(grid.in, grid.approximate) : null);
        setTodayItem('export', grid && grid.out >= 0.05 ? formatKwh(grid.out, grid.approximate) : null);
        setTodayItem('ev', ev ? formatKwh(ev.in + ev.out, ev.approximate) + solarShare('evKwh', 'evSolarKwh') : null);
        setTodayItem('battery', battery && battery.in >= 0.05
          ? formatKwh(battery.in, battery.approximate) + solarShare('batteryKwh', 'batterySolarKwh') : null);
        const extra = roleToday('extra');
        setTodayItem('extra', extra ? formatKwh(extra.in + extra.out, extra.approximate) : null);

        // Self-sufficiency: share of consumption not covered by grid import.
        const parts = [];
        const shareNow = FlowLogic.selfSufficiencyNow(powers, home);
        if (shareNow !== null) parts.push(`${Math.round(shareNow * 100)} % ${t.now}`);
        const shareToday = FlowLogic.selfSufficiencyToday({ grid, solar, battery });
        if (shareToday !== null) parts.push(`${Math.round(shareToday * 100)} % ${t.todayShort}`);
        setTodayItem('self', parts.length ? parts.join(' · ') : null);

        // Self-consumption: share of the solar production used at home instead of sold.
        const useParts = [];
        const useNow = FlowLogic.selfConsumptionNow(powers);
        if (useNow !== null) useParts.push(`${Math.round(useNow * 100)} % ${t.now}`);
        const useToday = FlowLogic.selfConsumptionToday({ grid, solar });
        if (useToday !== null) useParts.push(`${Math.round(useToday * 100)} % ${t.todayShort}`);
        setTodayItem('selfUse', useParts.length ? useParts.join(' · ') : null);

        setHidden(els.today, Object.values(els.todayItems).every((item) => item.root.hidden));
      }

      function render() {
        if (waitingFor) {
          showMessage(t.waitingTitle, waitingFor.length ? t.waitingText.replace('{apps}', waitingFor.join(', ')) : t.searchingText);
          return;
        }
        if (sources.size === 0) {
          if (suggestionPending) showMessage(t.searchingTitle, t.searchingText);
          else showMessage(t.configureTitle, t.configureText);
          return;
        }
        showFlow();

        const now = homeyNow();
        warnings.length = 0;
        const powers = {};
        for (const role of NODE_ROLES) {
          const info = roleInfo(role, now);
          powers[role] = info.power;
          renderNode(role, info, info.power);
          renderConnector(role, info, info.power);
        }
        const home = renderHome(powers, now);
        renderToday(powers, home);
        positionExtraConnector();
        renderDebug();
      }

      // The connector Home → extra node is diagonal, so it is placed from the rings' real
      // positions: from the edge of Home's ring to the edge of the extra node's ring.
      function positionExtraConnector() {
        if (!roleIds.extra.length) return;
        const conn = els.conns.extra;
        const box = els.flow.getBoundingClientRect();
        const from = els.nodes.home.root.querySelector('.node__ring').getBoundingClientRect();
        const to = els.nodes.extra.root.querySelector('.node__ring').getBoundingClientRect();
        if (!from.width || !to.width) return; // not laid out (yet)

        const ax = from.left + from.width / 2 - box.left;
        const ay = from.top + from.height / 2 - box.top;
        const bx = to.left + to.width / 2 - box.left;
        const by = to.top + to.height / 2 - box.top;
        const angle = Math.atan2(by - ay, bx - ax);
        const gap = 4; // px between ring and line, like the other connectors
        const startOffset = from.width / 2 + gap;
        const length = Math.max(0, Math.hypot(bx - ax, by - ay) - startOffset - to.width / 2 - gap);
        const half = (conn.offsetHeight || 12) / 2;

        setStyle(conn, 'left', `${(ax + Math.cos(angle) * startOffset).toFixed(1)}px`);
        setStyle(conn, 'top', `${(ay + Math.sin(angle) * startOffset - half).toFixed(1)}px`);
        setStyle(conn, 'width', `${length.toFixed(1)}px`);
        setStyle(conn, 'transform', `rotate(${angle.toFixed(4)}rad)`);
      }

      let renderQueued = false;
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          render();
        });
      }

      function applySnapshot(list) {
        const seen = new Set();
        for (const snap of list || []) {
          const d = sources.get(snap.id);
          if (!d) continue;
          seen.add(snap.id);
          if (snap.missing) {
            d.missing = true;
            continue;
          }
          d.missing = false;
          d.available = snap.available !== false;
          d.name = snap.name || d.name;
          d.powerCap = snap.power ? snap.power.capability : null;
          d.socCap = snap.soc ? snap.soc.capability : null;
          d.hasPower = Boolean(d.powerCap);
          d.hasSoc = Boolean(d.socCap);
          d.power = d.hasPower ? toNumber(snap.power.value) : null;
          d.powerTs = d.hasPower ? (snap.power.ts ?? null) : null;
          d.soc = d.hasSoc ? toNumber(snap.soc.value) : null;
          d.today = snap.today || null;
        }
        for (const [id, d] of sources) {
          if (!seen.has(id)) d.missing = true;
        }
      }

      /* ---------------- Debug (only when the backend says debug: true) ---------------- */

      const debugInfo = {
        enabled: false, events: 0, lastEvent: null, lastSubscribe: null, errors: 0,
      };
      const clock = (ts) => (ts ? new Date(ts).toLocaleTimeString() : '–');
      function debugLog(...args) {
        if (debugInfo.enabled) console.log('[HousePulse DEBUG]', ...args);
      }
      function renderDebug() {
        if (!debugInfo.enabled) return;
        const lines = [
          `DEBUG · ${instanceId} · ${autoMode ? `AUTO: ${autoUsedRoles.join(',')}` : 'manual'} · events ${debugInfo.events}`
            + ` · last ${clock(debugInfo.lastEvent)} · sub ${clock(debugInfo.lastSubscribe)}`
            + ` · err ${debugInfo.errors} · clock offset ${clockOffset} ms`,
        ];
        for (const role of ALL_ROLES) {
          for (const id of roleIds[role]) {
            const d = sources.get(id);
            const age = d.powerTs ? `${Math.round((homeyNow() - d.powerTs) / 1000)}s` : '–';
            const today = d.today
              ? ` today in=${d.today.inKwh.toFixed(2)}(${d.today.inSource[0]}) out=${d.today.outKwh.toFixed(2)}(${d.today.outSource[0]})`
              : '';
            const state = d.missing ? ' MISSING' : !d.available ? ' OFFLINE' : '';
            const capInfo = [d.powerCap, d.socCap].filter(Boolean).join('+') || '-';
            lines.push(`${role}: ${d.name || id} [${capInfo}]${state} ${d.power ?? '–'}W age ${age}`
              + `${d.hasSoc ? ` ${d.soc ?? '–'}%` : ''}${today}`);
          }
        }
        for (const warning of warnings) lines.push(`⚠ ${warning}`);
        setText(els.debug, lines.join('\n'));
      }

      /* ---------------- Live updates from app.js ---------------- */

      // Updates arrive per device + capability; route them to every source reading that capability.
      Homey.on('energy_update', (data) => {
        if (!data) return;
        const value = toNumber(data.value);
        let matched = false;
        for (const sourceId of deviceSources.get(data.deviceId) || []) {
          const d = sources.get(sourceId);
          let hit = false;
          if (d.powerCap === data.capability) {
            d.power = value;
            d.powerTs = toNumber(data.ts) ?? homeyNow();
            hit = true;
          }
          if (d.socCap === data.capability) {
            d.soc = value;
            hit = true;
          }
          if (hit) {
            d.missing = false;
            matched = true;
          }
        }
        if (!matched) return;
        if (debugInfo.enabled) {
          debugInfo.events++;
          debugInfo.lastEvent = Date.now();
          debugLog('update', data.deviceId, data.capability, data.value);
        }
        scheduleRender();
      });

      Homey.on('energy_status', (data) => {
        if (!data) return;
        for (const sourceId of deviceSources.get(data.deviceId) || []) {
          const d = sources.get(sourceId);
          d.available = data.available !== false;
          d.missing = data.missing === true;
        }
        debugLog('status', data);
        scheduleRender();
      });

      Homey.on('energy_split', (data) => {
        if (!data || !split || data.key !== split.key) return;
        split = data;
        debugLog('split', data);
        scheduleRender();
      });

      Homey.on('energy_today', (data) => {
        const d = data && sources.get(data.sourceId);
        if (!d) return;
        d.today = data;
        debugLog('today', d.name, data);
        scheduleRender();
      });

      /* ---------------- Auto height ---------------- */

      let reportedHeight = 0;
      // Content height plus any padding Homey puts on <body> (the homey-widget classes add
      // padding that our own CSS can't override), so the widget is never cut off at the bottom.
      function measureHeight() {
        const style = window.getComputedStyle(document.body);
        const padding = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
        return Math.ceil(els.root.getBoundingClientRect().height + padding);
      }
      function updateHeight() {
        const height = measureHeight();
        if (height <= 0 || Math.abs(height - reportedHeight) < 2) return;
        reportedHeight = height;
        if (typeof Homey.setHeight === 'function') Homey.setHeight(height);
      }
      if (typeof ResizeObserver === 'function') {
        // Fires when the column width changes, rows appear/disappear or the state switches.
        new ResizeObserver(() => requestAnimationFrame(() => {
          positionExtraConnector();
          updateHeight();
        })).observe(els.root);
      }

      /* ---------------- Subscribe ---------------- */

      let instanceId = null;
      try {
        if (typeof Homey.getWidgetInstanceId === 'function') instanceId = Homey.getWidgetInstanceId();
      } catch (err) { /* fall through */ }
      if (!instanceId) instanceId = `w-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

      // App names while the app waits for other apps at startup, otherwise null.
      let waitingFor = null;
      let startingTimer = null;

      async function subscribe() {
        if (sources.size === 0) return;
        try {
          const sentAt = Date.now();
          const result = await withTimeout(Homey.api('POST', '/subscribe', {
            instanceId,
            sourceIds: [...sources.keys()],
            split: {
              grid: roleIds.grid, solar: roleIds.solar, ev: roleIds.ev, battery: roleIds.battery, invert,
            },
          }), API_TIMEOUT_MS);
          const receivedAt = Date.now();
          if (result && typeof result.serverTime === 'number') {
            clockOffset = Math.round(result.serverTime - (sentAt + receivedAt) / 2);
          }
          if (result && result.starting) {
            // The app waits for the apps that own the devices: say so and ask again soon.
            waitingFor = Array.isArray(result.waitingFor) ? result.waitingFor : [];
            render();
            updateHeight();
            if (!startingTimer) {
              startingTimer = setTimeout(() => {
                startingTimer = null;
                subscribe();
              }, STARTING_RETRY_MS);
            }
            return;
          }
          waitingFor = null;
          applySnapshot(result && result.sources);
          split = (result && result.split) || null;
          hasLoaded = true;

          debugInfo.enabled = Boolean(result && result.debug);
          setHidden(els.debug, !debugInfo.enabled);
          if (debugInfo.enabled) {
            debugInfo.lastSubscribe = Date.now();
            debugLog('subscribe ok', { instanceId, settings, snapshot: result.sources });
          }

          render();
          updateHeight();
        } catch (err) {
          debugInfo.errors++;
          renderDebug();
          console.error('HousePulse: subscribe failed', err);
          if (!hasLoaded) showMessage(t.errorTitle, t.errorText);
        }
      }

      async function loadSuggestions() {
        try {
          const suggestion = await withTimeout(Homey.api('GET', '/suggest'), API_TIMEOUT_MS);
          suggestionPending = false;
          applySelection(suggestion);
          debugLog('suggestions', autoUsedRoles, suggestion);
          render();
          await subscribe();
          if (sources.size === 0) render(); // nothing suggested: show "configure" instead of "looking"
        } catch (err) {
          debugInfo.errors++;
          console.error('HousePulse: could not get suggested devices, retrying', err);
          // Meanwhile show the devices the user did choose.
          if (!hasLoaded) subscribe();
          setTimeout(loadSuggestions, SUGGEST_RETRY_MS);
        }
      }

      // Tell Homey the widget is ready before talking to the app: while the app or Homey is
      // starting, those calls can take long, and Homey shows a spinner until ready() is called.
      render();
      reportedHeight = measureHeight();
      Homey.ready({ height: reportedHeight || undefined });

      // With suggestions to load, subscribe once they are in (one subscribe with the full set,
      // so the app doesn't release and re-add the suggested devices).
      if (suggestionPending) loadSuggestions();
      else subscribe();
      // Keep the backend subscription alive, and retry if the first attempt failed.
      setInterval(subscribe, RESUBSCRIBE_INTERVAL_MS);
      // Re-evaluate "old value" markers even when nothing new arrives.
      setInterval(render, STALE_CHECK_INTERVAL_MS);
    }
  </script>
</body>
</html>
